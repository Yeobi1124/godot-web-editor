# 비공개 실행기 저장소에 넣는 파일: .github/workflows/godot-runner.yml (파일 이름을 바꾸지 말 것. Worker가 이 이름으로 실행한다)
# 실제 로직은 공개 저장소의 재사용 워크플로에 있고, 이 파일은 호출만 한다.
# 실행 기록·로그·캐시는 이 비공개 저장소에만 남는다.
# 필요한 설정 (이 비공개 저장소의 Settings → Secrets and variables → Actions)
#   Variables: GH_APP_ID            GitHub App ID
#   Secrets:   GH_APP_PRIVATE_KEY   GitHub App 비공개 키 (.pem 내용 전체)
# GitHub App이 이 저장소에 설치되어 있어야 한다 (Actions: Read and write).
name: Godot 실행기
run-name: gwe ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: '게임 저장소 (소유자/이름)'
        required: true
      sha:
        description: '커밋 SHA'
        required: true
      mode:
        description: 'test 또는 check'
        type: choice
        options: [test, check]
        default: test
      filter:
        description: '테스트 파일 이름 필터 (test 모드)'
        default: ''
      request_id:
        description: 'Worker가 결과를 찾을 때 쓰는 id'
        required: true

permissions:
  contents: read

jobs:
  run:
    uses: Yeobi1124/godot-web-editor/.github/workflows/godot-runner.yml@main
    with:
      repo: ${{ inputs.repo }}
      sha: ${{ inputs.sha }}
      mode: ${{ inputs.mode }}
      filter: ${{ inputs.filter }}
      app_id: ${{ vars.GH_APP_ID }}
    secrets:
      app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
