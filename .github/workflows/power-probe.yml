# 임시: Paperspace API 확인용 (읽기 전용). 확인이 끝나면 삭제합니다.
name: power-probe
on:
  push:
    branches: [claude/server-power]
    paths: [.github/workflows/power-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Paperspace API (state only)
        env:
          KEY: ${{ secrets.PAPERSPACE_API_KEY }}
          ID: ${{ secrets.PAPERSPACE_MACHINE_ID }}
        run: |
          echo "api key set: $([ -n "$KEY" ] && echo yes || echo NO) (length ${#KEY})"
          echo "machine id set: $([ -n "$ID" ] && echo yes || echo NO) (${ID:0:4}…)"
          [ -n "$KEY" ] && [ -n "$ID" ] || exit 1
          for url in "https://api.paperspace.com/v1/machines/$ID"; do
            code=$(curl -s -o body.json -w '%{http_code}' -H "Authorization: Bearer $KEY" "$url")
            echo "GET ${url%/*}/<id> -> $code"
            jq -c '{id, name, state, machineType, region, autoShutdownEnabled, autoShutdownTimeout} // .' body.json 2>/dev/null | head -c 600 || head -c 300 body.json
            echo
          done
          code=$(curl -s -o list.json -w '%{http_code}' -H "Authorization: Bearer $KEY" "https://api.paperspace.com/v1/machines?limit=5")
          echo "GET /v1/machines -> $code"
          jq -c '[.items[]? | {id, name, state}] // .' list.json 2>/dev/null | head -c 600
          echo
          code=$(curl -s -o legacy.json -w '%{http_code}' -H "X-Api-Key: $KEY" "https://api.paperspace.io/machines/getMachinePublic?machineId=$ID")
          echo "legacy api.paperspace.io -> $code"
