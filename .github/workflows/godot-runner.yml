# Godot 실행기 (재사용 워크플로): 게임 저장소의 테스트 실행 / 스크립트 검사
# 웹 에디터가 열려 있지 않을 때 Worker가 **비공개 실행기 저장소**의 호출 워크플로(runner-template/godot-runner.yml)를 실행하고,
# 그 워크플로가 이것을 부른다. 실행 기록·로그·캐시는 호출한 비공개 저장소에만 남는다 (다른 사용자 정보가 공개 로그에 남지 않도록).
# 실행 로직은 web/addon/web_editor_bridge/runner/ (브라우저와 같은 코드)
name: Godot 실행기 (재사용)

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      sha:
        type: string
        required: true
      mode:
        type: string
        default: test
      filter:
        type: string
        default: ''
      app_id:
        description: GitHub App ID (게임 저장소 읽기 토큰 발급용)
        type: string
        required: true
      runner_repo:
        description: 실행기 코드가 있는 저장소 (이 공개 저장소)
        type: string
        default: Yeobi1124/godot-web-editor
      runner_ref:
        type: string
        default: main
    secrets:
      app_private_key:
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2
      GODOT_SHA256: 8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e
      IN_REPO: ${{ inputs.repo }}
      IN_SHA: ${{ inputs.sha }}
      IN_MODE: ${{ inputs.mode }}
      IN_FILTER: ${{ inputs.filter }}
    steps:
      - name: 입력 확인
        id: in
        run: |
          [[ "$IN_MODE" == test || "$IN_MODE" == check ]] || { echo "잘못된 mode: $IN_MODE"; exit 1; }
          [[ "$IN_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "잘못된 저장소: $IN_REPO"; exit 1; }
          [[ "$IN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "잘못된 SHA: $IN_SHA"; exit 1; }
          [[ "$IN_FILTER" =~ ^[A-Za-z0-9_.-]*$ ]] || { echo "필터에는 영문, 숫자, _ . - 만 쓸 수 있습니다"; exit 1; }
          echo "owner=${IN_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${IN_REPO##*/}" >> "$GITHUB_OUTPUT"
          # 저장소마다 겹치지 않는 캐시 이름 (이름을 그대로 쓰면 a/b 와 a/b-c 가 접두어로 겹친다)
          echo "cache=$(printf '%s' "${IN_REPO,,}" | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: 실행기 코드
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.runner_repo }}
          ref: ${{ inputs.runner_ref }}
          path: self
          sparse-checkout: web/addon/web_editor_bridge/runner
          persist-credentials: false

      - name: 게임 저장소 읽기 토큰 (그 저장소만, contents:read)
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ steps.in.outputs.owner }}
          repositories: ${{ steps.in.outputs.name }}
          permission-contents: read

      - name: 게임 저장소
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          token: ${{ steps.token.outputs.token }}
          path: game
          persist-credentials: false

      # Godot 바이너리 캐시는 모든 사용자의 실행이 함께 쓴다.
      # 사용자 코드(테스트)가 돌기 전에만 저장하고, 복원할 때마다 체크섬을 확인한다 (바뀐 바이너리가 다른 사용자에게 퍼지지 않도록)
      - name: Godot 캐시 복원
        id: godot-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-verified

      - name: Godot 받기 / 확인
        id: godot
        run: |
          mkdir -p ~/godot && cd ~/godot
          bin="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          if echo "$GODOT_SHA256  $bin" | sha256sum -c --quiet - 2>/dev/null; then exit 0; fi
          rm -rf ~/godot/* && curl -fsSL --retry 3 -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${bin}.zip"
          unzip -q g.zip && rm g.zip
          echo "$GODOT_SHA256  $bin" | sha256sum -c --quiet -
          echo "downloaded=true" >> "$GITHUB_OUTPUT"

      - name: Godot 캐시 저장
        if: steps.godot.outputs.downloaded == 'true' && steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-verified

      - name: 리소스 import 캐시 (.godot)
        uses: actions/cache@v4
        with:
          path: game/.godot
          key: gwe-import-${{ steps.in.outputs.cache }}-${{ inputs.sha }}
          restore-keys: gwe-import-${{ steps.in.outputs.cache }}-

      - name: 리소스 import
        run: |
          mkdir -p game/.gwe_runner
          cp self/web/addon/web_editor_bridge/runner/*.gd game/.gwe_runner/
          timeout 600 ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path game --import > import.log 2>&1 || true
          tail -20 import.log

      - name: 실행
        run: |
          set +e
          timeout 600 ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path game -s res://.gwe_runner/cli.gd -- "$IN_MODE" "$IN_FILTER" > out.log 2>&1
          code=$?
          set -e
          tail -200 out.log | grep -v '^GWE_RESULT ' || true
          result=$(grep '^GWE_RESULT ' out.log | tail -1)
          if [ -z "$result" ]; then
            echo "GWE_RESULT {\"ok\":false,\"error\":\"실행기가 결과를 출력하지 못했습니다 (종료 코드 $code)\"}"
            exit 1
          fi
          echo "$result"
          {
            echo "### Godot 실행기 ($IN_MODE) — $IN_REPO@${IN_SHA:0:7}"
            echo '```json'
            echo "${result#GWE_RESULT }"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
